; Solid Ground - CC Camping Improved: settings.
; Put your changes here, above the reference section (for example: firespots = 4).
; With SKSE Menu Framework installed, the in-game settings page (Mod Control Panel > Solid Ground)
; saves your changes to Documents\My Games\Skyrim Special Edition\SKSE\SolidGroundCamping.ini
; instead. Lines in that file win over this one, and a mod update never touches it.

; ============================================================================================
; All settings and their defaults. Lines starting with ; are ignored. To change one, copy it
; above this section without the ; and set the value you want. Saved changes are picked up
; while the game runs (within about a second); 1 = on, 0 = off.
; ============================================================================================

; ---- Translation ----
; language = ENGLISH        ; for translators: show the text from Interface\Translations\SolidGroundCamping_<LANGUAGE>.txt
;                            ; instead of the game's own language (for example: language = GERMAN)

; ---- Tents ----
; tentwidth = 300            ; width of the spot every shelter is sized to fit
; tentdepth = 210            ; depth of that spot (front to back)
; tentfiregap = 15           ; gap between the fire ring and the front of the shelter's spot
; tentoutline = 1.1          ; how much of the tent's outline counts when keeping things clear of it
; tent0size = 1              ; size tweak per shelter: 0 lean-to, 1 hide tent, 2 fur tent, 3 leather tent
; tent1size = 1
; tent2size = 1
; tent3size = 1
; tent0door = 0              ; which way each shelter's opening points, degrees from its front
; tent1door = 0
; tent2door = 0
; tent3door = 0
; kittent_<name>_size = 1    ; the same for a tent from a kit file: its Name in lower case, letters and digits only
; kittent_<name>_door = 0    ; (for example kittent_myhut_door = 90 for a kit tent named "My Hut")

; ---- Bedroll and rugs ----
; bedturn = 180              ; extra turn of the bedroll inside the shelter (degrees)
; bedscale = 0.8             ; bedroll size
; bedback = 0                ; moves the bedroll back from the middle of the spot
; bedside = 0                ; moves the bedroll sideways
; bedlift = 1                ; lifts the bedroll off the ground a little
; bedtilt = 1                ; tilt the bedroll with the slope
; rug = 1                    ; rug under the bedroll in tents
; rugturn = 90               ; turn of the rug (degrees)

; ---- Layout ----
; shift = 160                ; cooking pot: along the fire's axis
; side = 0                   ; cooking pot: across it
; turn = 180                 ; cooking pot: turn (degrees)
; sink = 0                   ; cooking pot: into the ground
; scale = 1                  ; cooking pot: size
; blockshift = -80           ; chopping block: along the fire's axis
; blockside = 170            ; chopping block: across it
; blockturn = 90             ; chopping block: turn (degrees)
; blocksink = 0              ; chopping block: into the ground
; blockfacecamp = 1          ; chopping block faces the camp
; compact = 1                ; pull the camp's pieces closer together
; compactgap = 25            ; gap left between pieces when compacting
; clearradius = 450          ; plants, bushes and grass clumps hidden this far round the camp

; ---- Mound (earth foundation) ----
; foundation = 1             ; the earth mound under the camp
; foundationmargin = 0       ; extra rim round the camp's pieces
; foundationextras = 0       ; extra small mounds round the edge (0-4)
; foundationplants = 1       ; local plants where the mound meets the hill
; tentmound = 1              ; the tent stands on a mound of its own
; tentmoundoutline = 1       ; size of the tent's mound against its outline
; blockmound = 1             ; the chopping block stands on a mound of its own
; mounddrop = 4              ; how much lower the joined mounds' tops are (stops flicker)
; mounddropstep = 2.5        ; and each further one
; moundtile = (ground's own) ; texture size on the mound (default: the ground texture's own size)
; moundpaint = 1             ; paint the mound with the ground's texture
; moundshadows = 1           ; the mound casts shadows
; moundspecular = 1          ; the mound's shine
; dirtpatches = 14           ; low lumps of earth on the mound's top
; patchsink = 1              ; how far those lumps sit into the top
; extrarise = 15             ; extra mounds only where the ground is this close to the camp floor
; grass = 1                  ; grass tufts on the mound
; grassdensity = 5           ; tufts per 100 x 100
; grassmax = 220             ; most tufts per camp
; groundblend = 1            ; splashes of the hill's ground on the mound's foot
; groundblendstep = 55       ; spacing of those splashes
; groundblendfloat = 10      ; leave out a splash that would stand this far off the ground (steep hills)
; seamsplashes = 0           ; splashes along the seams where mounds overlap

; ---- Navigation ----
; navcut = 1                 ; NPCs walk round the tent
; navcutsize = 1             ; size of that area

; ---- Where a camp can't go ----
; cliffscan = 300            ; how far past the camp to look for a drop
; campgap = 1000             ; a new camp is refused this close to a camp already standing (its tent or mound)
; dgcampgap = 500            ; the same in dungeons (from a dungeon camp's bedroll)
; cliffdrop = 150            ; how far below the mound's side the ground may fall before it counts as a cliff
; cropmargin = 80            ; field kept clear round each crop or garden plot

; ---- Fire ----
; fireburnhours = 7          ; game hours a fire burns on 1 Firewood
; coldscale = 1              ; size of the cold (unlit) fire outdoors
; coldsink = 2               ; how far the cold fire sits into the ground
; firespots = 6              ; extra spots round the fire to warm hands or sit (0-12)
; firespotreach = 90         ; how far from the fire those spots are

; ---- Pack-up ----
; packdropmax = 40           ; you are set down when standing higher than this above the ground
; packdropto = 20            ; and set down this far above it

; ---- Dungeon camps ----
; dgfirescale = 0.7          ; fire size indoors
; dgrugscale = 1             ; rug size
; dgbedturn = 0              ; extra turn of the bedroll (degrees)
; dgroom = 0.7               ; room needed round each piece
; dgclear = 10              ; in dungeons, anything lying on the floor this high under a piece (a log, a crate) refuses the spot
; dgclearreach = 110        ; how high above the floor to look for it
; dglevel = 18               ; how uneven the floor may be
; dgcavernlevel = 28         ; the same in caverns like Blackreach
; dgbump = 6                 ; bumps allowed under a piece
; dgheadroom = 220           ; room above the fire
